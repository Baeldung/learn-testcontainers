server.port=8080
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Database (overridden by @ServiceConnection in tests)
spring.datasource.url=jdbc:postgresql://localhost:5432/ltcdb
spring.datasource.username=ltc
spring.datasource.password=ltc

# Kafka (overridden by @ServiceConnection in tests)
spring.kafka.bootstrap-servers=localhost:9092

# Redis (overridden by @ServiceConnection in tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379
